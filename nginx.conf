# Static serving for the built SPA.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PNG and the already-compressed formats are skipped; the brand marks are the largest
    # things served here and gzip cannot improve on them.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Exact-match wins over the prefix locations below, and internal redirects from try_files
    # re-run location matching — so this also covers every SPA route that falls back to the
    # entry point.
    #
    # Caching index.html is the classic way to break a redeploy: the browser keeps the old HTML,
    # which references asset filenames that no longer exist, and the app dies on a blank screen
    # until a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Vite fingerprints these filenames, so a changed file is a changed URL and the response can
    # be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deliberately short-lived: docker-compose.yml bind-mounts this directory so the signature
    # can be swapped without rebuilding the image. A year-long cache would defeat that.
    location /brand/ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback. Without this, opening or refreshing a deep link such as
    # /mindmaps/<id>/animate asks nginx for a file that does not exist and returns 404 — the
    # route only exists inside the React router, which cannot run until index.html loads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
